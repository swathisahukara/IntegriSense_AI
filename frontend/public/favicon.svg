<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background merged with browser tab -->

  <!-- Outer subtle ring -->
  <circle cx="90" cy="90" r="68" fill="none" stroke="#1a2535" stroke-width="1"/>
  <circle cx="90" cy="90" r="54" fill="none" stroke="#1a2535" stroke-width="0.5" stroke-dasharray="3 4"/>

  <!-- Left endpoint node -->
  <circle cx="30" cy="90" r="8" fill="#6B2A12" stroke="#D85A30" stroke-width="1.5"/>
  <circle cx="30" cy="90" r="4" fill="#D85A30"/>

  <!-- Right endpoint node -->
  <circle cx="150" cy="90" r="8" fill="#6B2A12" stroke="#D85A30" stroke-width="1.5"/>
  <circle cx="150" cy="90" r="4" fill="#D85A30"/>

  <!-- Input arrow -->
  <line x1="8" y1="90" x2="20" y2="90" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="20,86 28,90 20,94" fill="#993C1D"/>

  <!-- Output arrow -->
  <line x1="160" y1="90" x2="172" y2="90" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="164,86 172,90 164,94" fill="#993C1D"/>

  <!-- Infinity path -->
  <path d="M50,90 C50,68 65,52 90,66 C115,80 125,80 140,68 C155,56 170,68 170,90 C170,112 155,124 140,112 C125,100 115,100 90,114 C65,128 50,112 50,90 Z"
        fill="none"
        stroke="#D85A30"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner highlight trace -->
  <path d="M50,90 C50,68 65,52 90,66 C115,80 125,80 140,68 C155,56 170,68 170,90"
        fill="none"
        stroke="#F09975"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.5"/>

  <!-- Top crossing dot -->
  <circle cx="109" cy="80" r="5.5" fill="#F09975" filter="url(#softglow)"/>
  <!-- Bottom crossing dot -->
  <circle cx="71" cy="100" r="4" fill="#D85A30" opacity="0.6" filter="url(#softglow)"/>
  <!-- Far right dot -->
  <circle cx="155" cy="86" r="3" fill="#993C1D" opacity="0.8"/>

  <!-- Center crossover highlight -->
  <circle cx="90" cy="90" r="3.5" fill="#FAECE7" opacity="0.9"/>
  <circle cx="90" cy="90" r="6" fill="none" stroke="#F09975" stroke-width="0.8" opacity="0.5"/>
</svg>